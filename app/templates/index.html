<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multilingual Fake News Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <main class="shell">
        <section class="intro">
            <p class="eyebrow">News verification</p>
            <h1>Multilingual Fake News Detector</h1>
            <p class="subtitle">
                Paste article text or submit a news URL to detect language, translate when needed,
                and estimate whether the story is real or fake.
            </p>
        </section>

        <section class="workspace" aria-label="Prediction form">
            <div class="tabs" role="tablist" aria-label="Prediction mode">
                <button class="tab active" id="text-tab" type="button" data-mode="text" role="tab" aria-selected="true">
                    Text
                </button>
                <button class="tab" id="url-tab" type="button" data-mode="url" role="tab" aria-selected="false">
                    URL
                </button>
            </div>

            <form id="predict-form" class="panel">
                <label id="input-label" for="news-input">Article text</label>
                <textarea id="news-input" rows="10" placeholder="Paste news text here..." required></textarea>
                <button class="primary" type="submit">Analyze</button>
            </form>

            <section id="result" class="result hidden" aria-live="polite"></section>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
